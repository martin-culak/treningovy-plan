const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const dow = iso => new Date(iso + 'T12:00:00Z').getUTCDay();
const fmtShort = iso => (+iso.slice(8, 10)) + '. ' + (+iso.slice(5, 7)) + '.';
const fmtFull = iso => fmtShort(iso) + ' ' + iso.slice(0, 4);
const fmtLong = iso => DAY_NAMES[dow(iso)] + ' ' + fmtFull(iso);
function todayIso() { const t = new Date(); return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); }
const DATES = Array.from({ length: DAY_COUNT }, (_, i) => addDays(START, i));
const END = DATES[DAY_COUNT - 1];
const weekOf = iso => Math.floor(DATES.indexOf(iso) / 7);
const typeOf = t => (TYPES[t] ? t : 'other');
const groupOf = t => GROUPS[TYPES[typeOf(t)].group];
const isGym = t => TYPES[typeOf(t)].group === 'gym';
const usesExercises = t => isGym(t) || t === 'other';
function weekRange(w) {
  const a = DATES[w * 7], b = DATES[w * 7 + 6];
  return (a.slice(0, 4) === b.slice(0, 4) ? fmtShort(a) : fmtFull(a)) + ' – ' + fmtFull(b);
}

   ===================================================================== */
function buildDefault() {
  const days = {};
  RAW.forEach((r, i) => {
    days[DATES[i]] = { type: r[0], time: r[1], title: r[2], desc: r[3], ex: TPL[r[0]] ? clone(TPL[r[0]].ex) : [], done: false, u: 0 };
  });
  const light = days['2026-12-09'].ex; // odľahčený Lower v 4. týždni
  light[0].d = '3 série × 5 opakovaní (odľahčené – o 1 sériu menej)';
  light[2].d = '2 série × 8 opakovaní na každú nohu (odľahčené – o 1 sériu menej)';
  return { v: 1, updatedAt: 0, weeks: clone(WEEKS), days };
}

function normalize(s) {
  const def = buildDefault();
  if (!s || typeof s !== 'object' || !s.days || typeof s.days !== 'object') return def;
  const out = { v: 1, updatedAt: +s.updatedAt || 0, weeks: [], days: {} };
  for (let w = 0; w < 7; w++) out.weeks.push(Object.assign({}, def.weeks[w], (Array.isArray(s.weeks) && s.weeks[w]) || {}));
  DATES.forEach(iso => {
    const d = s.days[iso];
    if (!d || typeof d !== 'object') { out.days[iso] = def.days[iso]; return; }
    out.days[iso] = {
      type: typeOf(d.type),
      time: String(d.time == null ? '' : d.time),
      title: String(d.title == null ? '' : d.title),
      desc: String(d.desc == null ? '' : d.desc),
      ex: Array.isArray(d.ex) ? d.ex.filter(e => e && (e.n || e.d)).map(e => ({ n: String(e.n || ''), d: String(e.d || '') })) : [],
      done: !!d.done,
      u: +d.u || 0
    };
  });
  return out;
}

let storageOk = true;
let bakedState = null;
let conflict = false;

function readBaked() {
  try {
    const t = (document.getElementById('plan-data').textContent || '').trim();
    return t && t !== 'null' ? JSON.parse(t) : null;
  } catch (e) { return null; }
}
function readLocal() {
  try {
    const t = localStorage.getItem(STORAGE_KEY);
    return t ? JSON.parse(t) : null;
  } catch (e) { storageOk = false; return null; }
}
function loadState() {
  bakedState = readBaked();
  const local = readLocal();
  let pick = local || bakedState;
  if (bakedState && local) {
    if ((+bakedState.updatedAt || 0) > (+local.updatedAt || 0)) pick = bakedState;
    else if (JSON.stringify(normalize(local).days) !== JSON.stringify(normalize(bakedState).days)) conflict = true;
  }
  return normalize(pick);
}
function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); storageOk = true; }
  catch (e) { storageOk = false; }
}
/* lokálna zmena: uloží do prehliadača a naplánuje odoslanie na GitHub */
function persist() {
  state.updatedAt = Date.now();
  saveLocal();
  onLocalChange();
}
/* označí deň ako zmenený (pre zlúčenie zmien medzi zariadeniami) */
function touch(iso) { state.days[iso].u = Date.now(); }
/* nahradí celý stav a označí všetky dni, ktoré sa tým zmenili */
function replaceState(next) {
  const now = Date.now();
  DATES.forEach(iso => { if (JSON.stringify(next.days[iso]) !== JSON.stringify(state.days[iso])) next.days[iso].u = now; });
  next.weeks.forEach((w, i) => { if (JSON.stringify(w) !== JSON.stringify(state.weeks[i])) w.u = now; });
  state = next;
  persist();
}

let state = loadState();
let undoSnap = null;
const openEx = new Set();
let view = { week: 0 };

function snapshot() { undoSnap = JSON.stringify(state); }
function undo() {
  if (!undoSnap) return;
  replaceState(normalize(JSON.parse(undoSnap)));
  undoSnap = null;
  render();
  toast('Zmena bola vrátená.');
}

      <p class="mt-2 text-xs leading-relaxed text-slate-400">${GH.owner ? 'Úpravy a odškrtnutia sa ukladajú v tomto prehliadači a automaticky sa synchronizujú cez GitHub – medzi počítačom aj mobilom.' : 'Úpravy a odškrtnutia sa ukladajú automaticky v tomto prehliadači. Na prenos do mobilu alebo zálohu stiahni upravený .html súbor.'}</p>
      ${warn}
      <div class="mt-4 flex flex-wrap gap-1.5">${legendHtml()}</div>
    </div>
  </header>`;
}

function navHtml() {
  const tw = weekOf(todayIso());
  const tab = (key, label, active, dot) => `<button type="button" data-action="week" data-week="${key}" ${active ? 'data-tab-active aria-current="true"' : ''}
      class="relative shrink-0 whitespace-nowrap rounded-full px-3.5 py-2 text-sm font-semibold transition ${active ? 'bg-slate-900 text-white shadow' : 'bg-white text-slate-700 ring-1 ring-slate-200 hover:bg-slate-50'}">${label}${dot ? '<span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-sky-500"></span>' : ''}</button>`;
  let tabs = '';
  for (let w = 0; w < 7; w++) tabs += tab(w, 'Týždeň ' + (w + 1), view.week === w, w === tw);
  tabs += tab('all', 'Všetky týždne', view.week === 'all', false);
  return `
  <nav class="sticky top-0 z-30 border-b border-slate-200/80 bg-slate-100/90 backdrop-blur supports-[backdrop-filter]:bg-slate-100/75">
    <div class="mx-auto flex max-w-3xl lg:max-w-5xl items-center gap-2 px-4 py-2.5 sm:px-6">
      <div id="tabs" class="no-scrollbar relative -my-1 flex flex-1 gap-1.5 overflow-x-auto py-1 sm:flex-wrap sm:overflow-visible">${tabs}</div>
      <button type="button" data-action="today" class="inline-flex shrink-0 items-center gap-1.5 rounded-full bg-sky-600 px-3.5 py-2 text-sm font-semibold text-white shadow transition hover:bg-sky-700 active:scale-[.97]">${svg(IC.target)}<span class="sm:hidden">Dnes</span><span class="hidden sm:inline">Dnešný deň</span></button>
    </div>
  </nav>`;
}

function exHtml(iso, d) {
  if (!d.ex.length) return '';
  const tplName = TPL[d.type] ? TPL[d.type].name : 'Zoznam cvikov';
  const items = d.ex.map((e, i) => `
      <li class="flex gap-2.5">
        <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-slate-900/80 text-[11px] font-bold text-white">${i + 1}</span>
        <div class="min-w-0"><div class="font-semibold text-slate-800">${esc(e.n)}</div>${e.d ? `<div class="text-slate-600">${esc(e.d)}</div>` : ''}</div>
      </li>`).join('');
  return `
    <details class="ex-details mt-3 rounded-xl border border-black/10 bg-white/75" data-date="${iso}" ${openEx.has(iso) ? 'open' : ''}>
      <summary class="flex items-center justify-between gap-2 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-800 hover:bg-white">
        <span>🏋️ Cviky (${d.ex.length}) · <span class="font-medium text-slate-600">${esc(tplName)}</span></span>
        ${svg(IC.chev, 'chev h-4 w-4 shrink-0 text-slate-500')}
      </summary>
      <ol class="space-y-2.5 border-t border-black/5 px-3 py-3 text-sm">${items}</ol>
      <div class="px-3 pb-3"><button type="button" data-action="edit" data-date="${iso}" data-focus="ex" class="inline-flex items-center gap-1 text-xs font-semibold text-slate-600 underline-offset-2 hover:underline">${svg(IC.pencil, 'h-3.5 w-3.5')}Upraviť cviky</button></div>
    </details>`;
}

function cardHtml(iso) {
  const d = state.days[iso];
  const g = groupOf(d.type);
  const isToday = iso === todayIso();
  const hol = HOLIDAYS[iso];
  const btn = 'inline-flex items-center gap-1.5 rounded-lg bg-white/80 px-3 py-2 text-sm font-semibold text-slate-700 ring-1 ring-black/10 transition hover:bg-white active:scale-[.98]';
  return `
  <article id="d-${iso}" data-date="${iso}" class="day-card relative flex overflow-hidden rounded-2xl border shadow-sm ${g.card} ${d.done ? 'is-done' : ''} ${isToday ? 'ring-2 ring-sky-500 ring-offset-2 ring-offset-slate-100' : ''}">
    <div class="w-1.5 shrink-0 ${g.strip}"></div>
    <div class="min-w-0 flex-1 p-3.5 sm:p-4">
      <div class="flex items-start gap-3">
        <div class="w-11 shrink-0 pt-0.5 text-center">
          <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500">${DAY_SHORT[dow(iso)]}</div>
          <div class="text-2xl font-extrabold leading-none text-slate-900">${+iso.slice(8, 10)}</div>
          <div class="mt-0.5 text-[11px] font-medium text-slate-500">${MONTHS[+iso.slice(5, 7) - 1]}</div>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-1.5">
            <span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-semibold ${g.badge}">${g.icon} ${g.name}</span>
            ${isToday ? '<span class="rounded-full bg-sky-600 px-2 py-0.5 text-[11px] font-bold uppercase tracking-wide text-white">Dnes</span>' : ''}
            ${hol ? `<span class="rounded-full bg-rose-100 px-2 py-0.5 text-xs font-semibold text-rose-700">${esc(hol)}</span>` : ''}
          </div>
          <h3 class="day-title mt-1.5 break-words text-base font-bold leading-snug text-slate-900 sm:text-lg">${esc(d.title || TYPES[d.type].label)}</h3>
          ${d.time ? `<p class="mt-1 flex items-start gap-1.5 text-sm font-medium text-slate-600">${svg(IC.clock, 'mt-0.5 h-4 w-4 shrink-0')}<span>${esc(d.time)}</span></p>` : ''}
        </div>
        <label class="-mr-1 -mt-1 flex shrink-0 cursor-pointer select-none flex-col items-center gap-1 rounded-xl px-2 py-1.5 text-[11px] font-semibold text-slate-600 transition hover:bg-black/5" title="Označiť ako hotové">
          <input type="checkbox" data-action="done" data-date="${iso}" class="h-6 w-6 cursor-pointer accent-emerald-600" ${d.done ? 'checked' : ''}>
          Hotovo
        </label>
      </div>
      ${d.desc ? `<p class="desc mt-2.5 break-words text-sm leading-relaxed text-slate-700">${esc(d.desc)}</p>` : ''}
      ${exHtml(iso, d)}
      <div class="mt-3 flex flex-wrap gap-2">
        <button type="button" data-action="edit" data-date="${iso}" class="${btn}">${svg(IC.pencil)}Upraviť</button>
        <button type="button" data-action="swap" data-date="${iso}" class="${btn}">${svg(IC.swap)}Vymeniť / kopírovať</button>
      </div>
    </div>
  </article>`;
}

function weekHtml(w) {
  const wk = state.weeks[w];
  let cards = '';
  for (let i = 0; i < 7; i++) cards += cardHtml(DATES[w * 7 + i]);
  return `
  <section id="w-${w}" class="mb-10 scroll-mt-20">
    <div class="mb-3 flex flex-wrap items-end justify-between gap-x-3 gap-y-2">
      <h2 class="text-xl font-extrabold tracking-tight text-slate-900">Týždeň ${w + 1} <span class="ml-1 text-sm font-medium text-slate-500">${weekRange(w)}</span></h2>
      <div class="flex flex-wrap items-center gap-1.5">
        ${wk.tag ? `<span class="rounded-full bg-rose-100 px-2.5 py-1 text-xs font-semibold text-rose-700">${esc(wk.tag)}</span>` : ''}
        <button type="button" data-action="week-note" data-week="${w}" class="inline-flex items-center gap-1.5 rounded-full bg-white px-2.5 py-1 text-xs font-medium text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50" title="Upraviť poznámku k týždňu">${esc(wk.note || 'Pridať poznámku')} ${svg(IC.pencil, 'h-3 w-3')}</button>
      </div>
    </div>
    <div class="space-y-3">${cards}</div>
  </section>`;
}

function render() {
  let body = '';
  if (view.week === 'all') {
    for (let w = 0; w < 7; w++) body += weekHtml(w);
  } else {
    const w = view.week;
    const nb = 'inline-flex items-center gap-1.5 rounded-xl bg-white px-3.5 py-2.5 text-sm font-semibold text-slate-700 ring-1 ring-slate-200 hover:bg-slate-50';
    body = weekHtml(w) + `
      <div class="-mt-4 flex items-center justify-between gap-3">
        ${w > 0 ? `<button type="button" data-action="week" data-week="${w - 1}" data-scroll="1" class="${nb}">${svg(IC.left)}Týždeň ${w}</button>` : '<span></span>'}
        ${w < 6 ? `<button type="button" data-action="week" data-week="${w + 1}" data-scroll="1" class="${nb}">Týždeň ${w + 2}${svg(IC.right)}</button>` : ''}
      </div>`;
  }
  app.innerHTML = headerHtml() + navHtml() + `<main class="mx-auto max-w-3xl lg:max-w-5xl px-4 pb-32 pt-5 sm:px-6">${body}</main>`;
  const tabs = document.getElementById('tabs');
  const act = tabs && tabs.querySelector('[data-tab-active]');
  if (act) tabs.scrollLeft = act.offsetLeft - (tabs.clientWidth - act.offsetWidth) / 2;
}

/* =====================================================================
   TOAST, MODÁLNE OKNÁ
   ===================================================================== */
function toast(msg, action, ms) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast-in pointer-events-auto flex w-full max-w-md items-center gap-3 rounded-2xl bg-slate-900 px-4 py-3 text-sm text-white shadow-xl';
  el.innerHTML = `<span class="flex-1">${esc(msg)}</span>`;
  if (action) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'shrink-0 rounded-lg bg-white/15 px-3 py-1.5 font-semibold text-sky-200 hover:bg-white/25';
    b.textContent = action.label;
    b.onclick = () => { el.remove(); action.fn(); };
    el.appendChild(b);
  }
  root.appendChild(el);
  while (root.children.length > 2) root.firstElementChild.remove();
  setTimeout(() => el.remove(), ms || (action ? 7000 : 3200));
}

function flashCard(iso) {
  const el = document.getElementById('d-' + iso);
  if (!el) return;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

let modal = null;
const INP = 'w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-base text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200 sm:text-sm';
const LBL = 'mb-1.5 block text-sm font-semibold text-slate-800';

function openModal(inner) {
  document.getElementById('modal-root').innerHTML = `
  <div class="fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-4" role="dialog" aria-modal="true">
    <div class="fade-in absolute inset-0 bg-slate-900/50" data-action="close"></div>
    <div class="sheet-in relative flex max-h-[92vh] w-full flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl sm:max-h-[88vh] sm:max-w-lg sm:rounded-3xl">${inner}</div>
  </div>`;
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
  document.body.style.overflow = '';
  modal = null;
}
function modalHead(kicker, title, sub) {
  return `
    <div class="flex items-start justify-between gap-3 border-b border-slate-100 px-5 pb-3 pt-4">
      <div class="min-w-0">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">${kicker}</p>
        <h2 class="text-lg font-bold text-slate-900">${title}</h2>
        ${sub ? `<p class="mt-0.5 truncate text-sm text-slate-500">${sub}</p>` : ''}
      </div>
      <button type="button" data-action="close" class="-mr-2 rounded-full p-2 text-slate-500 hover:bg-slate-100" aria-label="Zavrieť">${svg(IC.x, 'h-5 w-5')}</button>
    </div>`;
}

/* ---------- Úprava dňa ---------- */
function openEdit(iso, focus) {
  const d = state.days[iso];
  modal = { kind: 'edit', iso, origType: d.type, origTitle: d.title, titleTouched: false, draft: { type: d.type, time: d.time, title: d.title, desc: d.desc, ex: clone(d.ex) } };
  if (!modal.draft.ex.length && TPL[d.type]) modal.draft.ex = clone(TPL[d.type].ex);
  openModal(modalHead('Upraviť deň', esc(fmtLong(iso))) + `
    <form id="edit-form" class="flex-1 space-y-5 overflow-y-auto px-5 py-4" autocomplete="off">
      <fieldset>
        <legend class="${LBL}">Typ tréningu / kategória</legend>
        <div id="type-grid" class="grid grid-cols-2 gap-2"></div>
      </fieldset>
      <label class="block"><span class="${LBL}">Čas tréningu</span>
        <input name="time" list="time-options" value="${esc(d.time)}" placeholder="napr. 17:00, Poobede…" class="${INP}">
      </label>
      <label class="block"><span class="${LBL}">Názov tréningu</span>
        <input name="title" value="${esc(d.title)}" placeholder="napr. Beh – Zóna 2 (8,0 km)" class="${INP}">
      </label>
      <label class="block"><span class="${LBL}">Podrobný popis (rozpis)</span>
        <textarea name="desc" rows="5" placeholder="Čo presne ťa v tento deň čaká…" class="${INP} leading-relaxed">${esc(d.desc)}</textarea>
      </label>
      <section id="ex-section" class="scroll-mt-4">
        <div class="mb-2 flex items-center justify-between gap-2">
          <h3 class="text-sm font-semibold text-slate-800">Cviky</h3>
          <button type="button" data-action="ex-template" class="inline-flex items-center gap-1 rounded-lg px-2 py-1 text-xs font-semibold text-sky-700 hover:bg-sky-50"></button>
        </div>
        <div id="ex-list" class="space-y-2"></div>
        <button type="button" data-action="ex-add" class="mt-2 inline-flex w-full items-center justify-center gap-1.5 rounded-xl border-2 border-dashed border-slate-300 px-3 py-2.5 text-sm font-semibold text-slate-600 hover:border-slate-400 hover:bg-slate-50">${svg(IC.plus)}Pridať cvik</button>
        <label id="ex-apply-wrap" class="mt-3 flex cursor-pointer items-start gap-2.5 rounded-xl bg-slate-50 p-3 text-sm text-slate-700 ring-1 ring-slate-200">
          <input type="checkbox" name="applyAll" class="mt-0.5 h-5 w-5 shrink-0 accent-sky-600">
          <span>Použiť tento zoznam cvikov aj pre všetky <b>ďalšie</b> dni typu <b id="ex-apply-type"></b></span>
        </label>
      </section>
    </form>
    <div class="safe-bottom flex gap-2 border-t border-slate-100 px-5 pt-3">
      <button type="button" data-action="close" class="flex-1 rounded-xl bg-slate-100 px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-200">Zrušiť</button>
      <button type="submit" form="edit-form" class="flex-[2] rounded-xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white shadow hover:bg-slate-800">Uložiť zmeny</button>
    </div>`);
  renderTypeGrid(); renderExList(); syncExSection();
  if (focus === 'ex') document.getElementById('ex-section').scrollIntoView({ block: 'start' });
}

function renderTypeGrid() {
  document.getElementById('type-grid').innerHTML = Object.keys(TYPES).map(k => {
    const g = GROUPS[TYPES[k].group], sel = modal.draft.type === k;
    return `<button type="button" data-action="pick-type" data-type="${k}" aria-pressed="${sel}"
      class="flex min-h-[2.75rem] items-center gap-2 rounded-xl border px-3 py-2 text-left text-sm font-semibold leading-tight transition ${sel ? g.sel + ' text-slate-900' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">
      <span class="h-3 w-3 shrink-0 rounded-full ${g.dot}"></span><span class="min-w-0">${esc(TYPES[k].label)}</span></button>`;
  }).join('');
}

function renderExList() {
  const ex = modal.draft.ex;
  const inp = 'rounded-lg border border-slate-300 bg-white px-2.5 py-2 text-base focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200 sm:text-sm';
  const ib = 'flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-200/70 disabled:opacity-30';
  document.getElementById('ex-list').innerHTML = ex.length ? ex.map((e, i) => `
    <div class="rounded-xl border border-slate-200 bg-slate-50/70 p-2.5">
      <div class="flex items-center gap-1.5">
        <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-slate-900 text-xs font-bold text-white">${i + 1}</span>
        <input data-ex="n" data-i="${i}" value="${esc(e.n)}" placeholder="Názov cviku" aria-label="Názov cviku ${i + 1}" class="${inp} min-w-0 flex-1 font-semibold">
        <button type="button" data-action="ex-up" data-i="${i}" class="${ib}" ${i === 0 ? 'disabled' : ''} aria-label="Posunúť vyššie">${svg(IC.up)}</button>
        <button type="button" data-action="ex-del" data-i="${i}" class="${ib} hover:text-red-600" aria-label="Odstrániť cvik">${svg(IC.trash)}</button>
      </div>
      <input data-ex="d" data-i="${i}" value="${esc(e.d)}" placeholder="Série × opakovania, poznámka" aria-label="Série a opakovania – cvik ${i + 1}" class="${inp} mt-2 w-full">
    </div>`).join('') : '<p class="rounded-xl bg-slate-50 px-3 py-3 text-sm text-slate-500">Zatiaľ žiadne cviky.</p>';
}

function syncExSection() {
  const t = modal.draft.type;
  document.getElementById('ex-section').classList.toggle('hidden', !usesExercises(t));
  document.getElementById('ex-apply-wrap').classList.toggle('hidden', !isGym(t));
  document.getElementById('ex-apply-type').textContent = TYPES[t].label;
  const tb = document.querySelector('[data-action="ex-template"]');
  tb.classList.toggle('hidden', !TPL[t]);
  if (TPL[t]) tb.innerHTML = svg(IC.reset, 'h-3.5 w-3.5') + 'Načítať šablónu ' + esc(TPL[t].name.split(' – ')[0]);
}

function pickType(k) {
  const dr = modal.draft, old = dr.type;
  if (k === old) return;
  // názov sa prispôsobí novej kategórii, kým ho v tomto okne ručne neprepíšeš
  if (!modal.titleTouched || !dr.title.trim() || dr.title === TYPES[old].label) {
    dr.title = k === modal.origType ? modal.origTitle : TYPES[k].label;
    document.querySelector('#edit-form [name="title"]').value = dr.title;
  }
  const exIsOldTpl = TPL[old] && JSON.stringify(dr.ex) === JSON.stringify(TPL[old].ex);
  if (TPL[k] && (!dr.ex.length || exIsOldTpl || !usesExercises(old))) dr.ex = clone(TPL[k].ex);
  dr.type = k;
  renderTypeGrid(); renderExList(); syncExSection();
}

function saveEdit() {
  const { iso, draft } = modal;
  const f = document.getElementById('edit-form');
  const applyBox = f.elements.namedItem('applyAll');
  const applyAll = !!(applyBox && applyBox.checked);
  snapshot();
  const ex = usesExercises(draft.type) ? draft.ex.map(e => ({ n: e.n.trim(), d: e.d.trim() })).filter(e => e.n || e.d) : [];
  Object.assign(state.days[iso], { type: draft.type, time: draft.time.trim(), title: draft.title.trim(), desc: draft.desc.trim(), ex });
  touch(iso);
  let n = 0;
  if (applyAll && isGym(draft.type)) {
    DATES.forEach(x => { if (x > iso && state.days[x].type === draft.type) { state.days[x].ex = clone(ex); touch(x); n++; } });
  }
  persist(); closeModal(); render(); flashCard(iso);
  toast(n ? `Uložené. Zoznam cvikov sa zmenil aj v ${n} ďalších dňoch.` : 'Zmeny boli uložené.', { label: 'Späť', fn: undo });
}

/* ---------- Výmena / kopírovanie dní ---------- */
function swapRowsHtml() {
  let h = '';
  for (let w = 0; w < 7; w++) {
    h += `<h4 class="sticky top-0 z-10 bg-white/95 px-1 pb-1.5 pt-3 text-xs font-bold uppercase tracking-wider text-slate-500">Týždeň ${w + 1} · ${weekRange(w)}</h4>`;
    for (let i = 0; i < 7; i++) {
      const x = DATES[w * 7 + i], d = state.days[x], g = groupOf(d.type);
      const isSrc = x === modal.iso, sel = x === modal.target;
      h += `<button type="button" data-action="pick-target" data-date="${x}" ${isSrc ? 'disabled' : ''}
        class="mb-1.5 flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left transition ${isSrc ? 'cursor-default bg-slate-100 opacity-70' : sel ? 'bg-sky-50 ring-2 ring-sky-500' : 'bg-white ring-1 ring-slate-200 hover:bg-slate-50'}">
        <span class="h-3 w-3 shrink-0 rounded-full ${g.dot}"></span>
        <span class="w-[4.6rem] shrink-0 text-sm font-semibold text-slate-800">${DAY_SHORT[dow(x)]} ${fmtShort(x)}</span>
        <span class="min-w-0 flex-1 truncate text-sm text-slate-600">${esc(d.title || TYPES[d.type].label)}</span>
        ${isSrc ? '<span class="shrink-0 rounded-full bg-slate-900 px-2 py-0.5 text-[11px] font-bold text-white">tento deň</span>' : ''}
        ${sel ? '<span class="shrink-0 rounded-full bg-sky-600 px-2 py-0.5 text-[11px] font-bold text-white">cieľ</span>' : ''}
      </button>`;
    }
  }
  return h;
}

function openSwap(iso) {
  modal = { kind: 'swap', iso, target: null };
  const d = state.days[iso];
  openModal(modalHead('Vymeniť alebo skopírovať', esc(fmtLong(iso)), esc(d.title || TYPES[d.type].label)) + `
    <p class="px-5 pt-3 text-sm text-slate-600">Vyber deň, s ktorým chceš tréning <b>vymeniť</b>, alebo do ktorého ho chceš <b>skopírovať</b>.</p>
    <div id="swap-list" class="relative flex-1 overflow-y-auto px-5 pb-3">${swapRowsHtml()}</div>
    <div class="safe-bottom border-t border-slate-100 px-5 pt-3">
      <p id="swap-sel" class="mb-2 text-xs text-slate-500">Zatiaľ nie je vybraný žiadny deň.</p>
      <div class="flex gap-2">
        <button type="button" data-action="do-swap" disabled class="inline-flex flex-1 items-center justify-center gap-1.5 rounded-xl bg-slate-900 px-3 py-3 text-sm font-semibold text-white shadow hover:bg-slate-800 disabled:opacity-40">${svg(IC.swap)}Vymeniť dni</button>
        <button type="button" data-action="do-copy" disabled class="inline-flex flex-1 items-center justify-center gap-1.5 rounded-xl bg-white px-3 py-3 text-sm font-semibold text-slate-800 ring-1 ring-slate-300 hover:bg-slate-50 disabled:opacity-40">${svg(IC.copy)}Skopírovať sem</button>
      </div>
    </div>`);
  const list = document.getElementById('swap-list');
  const src = list.querySelector(`[data-date="${iso}"]`);
  if (src) list.scrollTop = Math.max(0, src.offsetTop - list.clientHeight / 2);
}

function pickTarget(x) {
  modal.target = x;
  const list = document.getElementById('swap-list'), top = list.scrollTop;
  list.innerHTML = swapRowsHtml();
  list.scrollTop = top;
  document.querySelectorAll('[data-action="do-swap"],[data-action="do-copy"]').forEach(b => { b.disabled = false; });
  document.getElementById('swap-sel').innerHTML = `Cieľ: <b class="text-slate-800">${esc(fmtLong(x))}</b> · kopírovanie prepíše tréning v cieľovom dni.`;
}

function doSwap(copy) {
  const { iso, target } = modal;
  if (!target) return;
  snapshot();
  if (copy) state.days[target] = Object.assign(clone(state.days[iso]), { done: false });
  else { const a = state.days[iso]; state.days[iso] = state.days[target]; state.days[target] = a; touch(iso); }
  touch(target);
  persist(); closeModal(); render(); flashCard(iso); flashCard(target);
  const lab = x => DAY_SHORT[dow(x)] + ' ' + fmtShort(x);
  toast(copy ? `Tréning skopírovaný do dňa ${lab(target)}` : `Vymenené: ${lab(iso)} ⇄ ${lab(target)}`, { label: 'Späť', fn: undo });
}

/* =====================================================================
   SYNCHRONIZÁCIA S GITHUBOM
   Plán sa ukladá do súboru plan.json vo vetve "data" tvojho repozitára.
   Čítanie funguje bez prihlásenia, zápis potrebuje prístupový token,
   ktorý sa ukladá iba v prehliadači daného zariadenia.
   ===================================================================== */
const GH_REPO = { owner: 'martin-culak', repo: 'treningovy-plan' };
const GH_TOKEN_KEY = 'treningovy-plan-gh-token';
const GH = (() => {
  const c = { owner: '', repo: '', branch: 'data', path: 'plan.json' };
  const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
  if (m) {
    c.owner = m[1];
    const seg = location.pathname.split('/').filter(Boolean)[0];
    c.repo = seg && !/\.html?$/i.test(seg) ? seg : m[1] + '.github.io';
  } else if (!/^__/.test(GH_REPO.owner)) {
    c.owner = GH_REPO.owner; c.repo = GH_REPO.repo;
  }
  return c;
})();

const sync = { status: 'idle', detail: '', sha: null, busy: false, again: false, timer: null, lastPull: 0, lastOk: 0 };

function ghToken() { try { return localStorage.getItem(GH_TOKEN_KEY) || ''; } catch (e) { return ''; } }

function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(b64) {
  return new TextDecoder().decode(Uint8Array.from(atob(String(b64).replace(/\s/g, '')), c => c.charCodeAt(0)));
}

function syncPillInner() {
  const t = sync.lastOk ? new Date(sync.lastOk).toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' }) : '';
  const map = {
    off: ['bg-slate-400', 'Synchronizácia s GitHubom nie je nastavená'],
    idle: ['bg-slate-400', 'GitHub: pripájam…'],
    readonly: ['bg-amber-400', 'GitHub: len čítanie – klikni a pridaj token'],
    busy: ['bg-sky-400 animate-pulse', 'GitHub: synchronizujem…'],
    pending: ['bg-sky-400 animate-pulse', 'GitHub: odosielam zmeny…'],
    ok: ['bg-emerald-400', 'Uložené na GitHube' + (t ? ' · ' + t : '')],
    offline: ['bg-amber-400', 'Bez pripojenia – zmeny odošlem neskôr'],
    token: ['bg-red-500', 'GitHub: neplatný token alebo chýbajú práva'],
    error: ['bg-red-500', 'GitHub: chyba synchronizácie' + (sync.detail ? ' (' + sync.detail + ')' : '')]
  };
  const [dot, text] = map[GH.owner ? sync.status : 'off'] || map.idle;
  return `<span class="h-2 w-2 shrink-0 rounded-full ${dot}"></span><span class="truncate">${esc(text)}</span>`;
}

function setSyncStatus(st, detail) {
  sync.status = st;
  sync.detail = detail || '';
  if (st === 'ok') sync.lastOk = Date.now();
  ['sync-pill', 'sync-status-text'].forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = syncPillInner(); });
}

/* volá sa pri každej lokálnej zmene (persist) */
function onLocalChange() {
  if (!GH.owner || !ghToken()) return;
  setSyncStatus('pending');
  clearTimeout(sync.timer);
  sync.timer = setTimeout(syncNow, 1500);
}

function pullIfStale(ms) { if (GH.owner && !sync.busy && Date.now() - sync.lastPull > ms) syncNow(); }

async function ghApi(method, path, body) {
  const headers = { Accept: 'application/vnd.github+json' };
  const tok = ghToken();
  if (tok) headers.Authorization = 'Bearer ' + tok;
  if (body) headers['Content-Type'] = 'application/json';
  const res = await fetch('https://api.github.com' + path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  let data = null;
  try { data = await res.json(); } catch (e) { /* bez tela */ }
  return { status: res.status, ok: res.ok, data };
}

/* zlúčenie: pri každom dni (a týždni) vyhráva novšia zmena */
function mergeStates(local, remote) {
  const out = clone(local);
  DATES.forEach(iso => { if ((+remote.days[iso].u || 0) > (+local.days[iso].u || 0)) out.days[iso] = clone(remote.days[iso]); });
  for (let w = 0; w < 7; w++) if ((+remote.weeks[w].u || 0) > (+local.weeks[w].u || 0)) out.weeks[w] = clone(remote.weeks[w]);
  out.updatedAt = Math.max(+local.updatedAt || 0, +remote.updatedAt || 0);
  return out;
}
const dataKey = s => JSON.stringify([s.days, s.weeks]);

async function createBranch(base) {
  const repo = await ghApi('GET', base);
  const def = repo.ok && repo.data.default_branch ? repo.data.default_branch : 'main';
  const ref = await ghApi('GET', `${base}/git/ref/heads/${encodeURIComponent(def)}`);
  if (ref.ok) await ghApi('POST', `${base}/git/refs`, { ref: 'refs/heads/' + GH.branch, sha: ref.data.object.sha });
}

async function syncNow() {
  if (!GH.owner) return;
  if (sync.busy) { sync.again = true; return; }
  sync.busy = true;
  clearTimeout(sync.timer);
  sync.lastPull = Date.now();
  setSyncStatus('busy');
  const base = `/repos/${GH.owner}/${GH.repo}`;
  const file = `${base}/contents/${GH.path}`;
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const r = await ghApi('GET', `${file}?ref=${encodeURIComponent(GH.branch)}`);
      if (r.status === 401) throw new Error('token');
      if (r.status === 403) throw new Error(ghToken() ? 'token' : 'limit');
      if (!r.ok && r.status !== 404) throw new Error('HTTP ' + r.status);
      let remote = null;
      sync.sha = null;
      if (r.ok) { sync.sha = r.data.sha; remote = normalize(JSON.parse(b64dec(r.data.content))); }
      if (remote) {
        const merged = mergeStates(state, remote);
        if (dataKey(merged) !== dataKey(state)) { state = merged; saveLocal(); render(); }
      }
      if (!ghToken()) { setSyncStatus(remote ? 'readonly' : 'error', remote ? '' : 'plan.json sa nenašiel'); return; }
      if (remote && dataKey(remote) === dataKey(state)) { setSyncStatus('ok'); return; }
      const body = { message: 'Plán upravený ' + new Date().toLocaleString('sk-SK'), content: b64enc(JSON.stringify(state)), branch: GH.branch };
      if (sync.sha) body.sha = sync.sha;
      let p = await ghApi('PUT', file, body);
      if (!p.ok && !remote && (p.status === 404 || p.status === 422)) { await createBranch(base); p = await ghApi('PUT', file, body); }
      if (p.ok) { sync.sha = p.data && p.data.content ? p.data.content.sha : null; setSyncStatus('ok'); return; }
      if (p.status === 401 || p.status === 403) throw new Error('token');
      if (p.status !== 409 && p.status !== 422) throw new Error('HTTP ' + p.status);
      /* 409/422: medzitým uložilo zmenu iné zariadenie → stiahni, zlúč a skús znova */
    }
    throw new Error('konflikt');
  } catch (e) {
    const msg = String((e && e.message) || e);
    if (msg === 'token') setSyncStatus('token');
    else if (navigator.onLine === false || e instanceof TypeError) setSyncStatus('offline');
    else setSyncStatus('error', msg === 'limit' ? 'príliš veľa požiadaviek, skús neskôr' : msg);
  } finally {
    sync.busy = false;
    if (sync.again) { sync.again = false; sync.timer = setTimeout(syncNow, 500); }
  }
}

/* ---------- Okno „Synchronizácia“ ---------- */
function openSyncSettings() {
  modal = { kind: 'sync' };
  const tok = ghToken();
  const repoUrl = `https://github.com/${GH.owner}/${GH.repo}`;
  const sb = 'inline-flex items-center justify-center gap-1.5 rounded-xl px-3.5 py-2.5 text-sm font-semibold transition';
  openModal(modalHead('Synchronizácia', 'Prepojenie s GitHubom') + `
    <div class="flex-1 space-y-4 overflow-y-auto px-5 py-4 text-sm leading-relaxed text-slate-700">
      <div class="rounded-xl bg-slate-50 p-3 ring-1 ring-slate-200">
        <p id="sync-status-text" class="flex items-center gap-2 font-semibold text-slate-800">${syncPillInner()}</p>
        ${GH.owner
          ? `<p class="mt-1 text-xs text-slate-500">Repozitár <a class="font-semibold text-sky-700 underline" href="${repoUrl}" target="_blank" rel="noopener">${esc(GH.owner + '/' + GH.repo)}</a> · súbor <code>${esc(GH.path)}</code> vo vetve <code>${esc(GH.branch)}</code></p>`
          : '<p class="mt-1 text-xs text-slate-500">Synchronizácia funguje, keď plán otvoríš z adresy GitHub Pages.</p>'}
      </div>
      ${tok ? `
      <p>V tomto zariadení je uložený prístupový token (končí na <b>…${esc(tok.slice(-4))}</b>). Každá zmena sa automaticky odošle na GitHub a pri otvorení plánu sa načítajú zmeny z ostatných zariadení.</p>
      <div class="flex flex-wrap gap-2">
        <button type="button" data-action="sync-now" class="${sb} bg-slate-900 text-white hover:bg-slate-800">${svg(IC.reset)}Synchronizovať teraz</button>
        <button type="button" data-action="sync-clear-token" class="${sb} bg-white text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50">${svg(IC.trash)}Odstrániť token</button>
      </div>` : `
      <p>Aby sa zmeny z <b>tohto zariadenia</b> ukladali na GitHub, vlož sem svoj prístupový token. Bez neho plán z GitHubu iba čítaš.</p>
      <label class="block"><span class="${LBL}">Prístupový token (fine-grained)</span>
        <input id="gh-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" class="${INP}">
      </label>
      <button type="button" data-action="sync-save-token" class="${sb} w-full bg-slate-900 py-3 text-white hover:bg-slate-800">Uložiť token a synchronizovať</button>`}
      <details class="rounded-xl ring-1 ring-slate-200">
        <summary class="px-3 py-2.5 font-semibold text-slate-800">Ako získam token?</summary>
        <ol class="list-decimal space-y-1.5 pb-3 pl-8 pr-3 text-slate-600">
          <li>Otvor <a class="font-semibold text-sky-700 underline" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → Fine-grained token → Generate new token</a>.</li>
          <li>Názov napr. „Tréningový plán – mobil“, platnosť (Expiration) 90 dní.</li>
          <li>Repository access: <b>Only select repositories</b> → <b>${esc(GH.repo || 'treningovy-plan')}</b>.</li>
          <li>Permissions → Repository permissions → <b>Contents: Read and write</b>.</li>
          <li>Klikni Generate token, skopíruj ho a vlož sem.</li>
        </ol>
      </details>
      <p class="text-xs text-slate-500">Token sa ukladá iba v tomto prehliadači a posiela sa iba na api.github.com. Nevkladaj ho nikam inam a nikomu ho neposielaj.</p>
    </div>`);
}

function saveToken() {
  const inp = document.getElementById('gh-token');
  const v = ((inp && inp.value) || '').trim();
  if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(v)) { toast('Toto nevyzerá ako GitHub token (začína na „github_pat_“).'); return; }
  try { localStorage.setItem(GH_TOKEN_KEY, v); } catch (e) { toast('Token sa v tomto prehliadači nepodarilo uložiť.'); return; }
  closeModal();
  toast('Token uložený, synchronizujem s GitHubom…');
  syncNow();
}

function clearToken() {
  if (!window.confirm('Odstrániť token z tohto zariadenia? Zmeny sa potom nebudú odosielať na GitHub.')) return;
  try { localStorage.removeItem(GH_TOKEN_KEY); } catch (e) { /* nič */ }
  closeModal();
  syncNow();
}

/* =====================================================================
   AKCIE: Dnes, týždne, poznámky, uloženie .html, obnovenie
   ===================================================================== */
function goToday() {
  const t = todayIso();
  let target = t, msg = '';
  if (t < START) { target = START; msg = 'Plán začína v pondelok 16. 11. 2026.'; }
  else if (t > END) { target = END; msg = 'Plán sa skončil v nedeľu 3. 1. 2027.'; }
  if (view.week !== 'all') view.week = weekOf(target);
  render();
  const el = document.getElementById('d-' + target);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); flashCard(target); }
  if (msg) toast(msg);
}

function setWeek(key, scroll) {
  const prev = view.week;
  view.week = key === 'all' ? 'all' : +key;
  render();
  const sec = document.getElementById('w-' + (view.week === 'all' ? (prev === 'all' ? 0 : prev) : view.week));
  if (sec && (scroll || window.scrollY > sec.offsetTop - 80)) sec.scrollIntoView({ block: 'start' });
}

function editWeekNote(w) {
  const v = window.prompt('Poznámka k týždňu ' + (w + 1) + ' (' + weekRange(w) + '):', state.weeks[w].note || '');
  if (v === null) return;
  snapshot();
  state.weeks[w].note = v.trim();
  state.weeks[w].u = Date.now();
  persist(); render();
}

function toggleDone(input) {
  const iso = input.dataset.date;
  state.days[iso].done = input.checked;
  touch(iso);
  persist();
  const card = document.getElementById('d-' + iso);
  if (card) card.classList.toggle('is-done', input.checked);
}

function buildHtmlFile() {
  const doc = document.documentElement.cloneNode(true);
  ['head', 'body'].forEach(tag => {
    const el = doc.querySelector(tag);
    Array.from(el.children).forEach(ch => { if (!ch.hasAttribute('data-keep')) ch.remove(); });
  });
  doc.querySelectorAll('[data-clear]').forEach(el => { el.innerHTML = ''; });
  doc.querySelector('body').removeAttribute('style');
  if (!state.updatedAt) persist();
  doc.querySelector('#plan-data').textContent = JSON.stringify(state).replace(/</g, '\\u003c');
  return '<!DOCTYPE html>\n' + doc.outerHTML + '\n';
}

function saveHtml() {
  const blob = new Blob([buildHtmlFile()], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'index.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Stiahnutý súbor index.html so všetkými tvojimi úpravami.');
}

function resetPlan() {
  if (!window.confirm('Obnoviť pôvodný plán?\n\nVšetky úpravy aj odškrtnutia sa vrátia do pôvodného stavu.')) return;
  snapshot();
  replaceState(buildDefault());
  openEx.clear();
  render();
  toast('Pôvodný plán bol obnovený.', { label: 'Späť', fn: undo });
}

/* =====================================================================
   UDALOSTI
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const a = el.dataset.action;
  if (a === 'done') return; // rieši 'change'
  const dr = modal && modal.draft;
  switch (a) {
    case 'week': setWeek(el.dataset.week, !!el.dataset.scroll); break;
    case 'today': goToday(); break;
    case 'edit': openEdit(el.dataset.date, el.dataset.focus); break;
    case 'swap': openSwap(el.dataset.date); break;
    case 'week-note': editWeekNote(+el.dataset.week); break;
    case 'save-html': saveHtml(); break;
    case 'reset': resetPlan(); break;
    case 'close': closeModal(); break;
    case 'pick-type': pickType(el.dataset.type); break;
    case 'ex-add': {
      dr.ex.push({ n: '', d: '' }); renderExList();
      const ins = document.querySelectorAll('#ex-list [data-ex="n"]');
      if (ins.length) ins[ins.length - 1].focus();
      break;
    }
    case 'ex-del': dr.ex.splice(+el.dataset.i, 1); renderExList(); break;
    case 'ex-up': {
      const i = +el.dataset.i;
      if (i > 0) { const t = dr.ex[i - 1]; dr.ex[i - 1] = dr.ex[i]; dr.ex[i] = t; renderExList(); }
      break;
    }
    case 'ex-template': {
      const tpl = TPL[dr.type];
      if (!tpl) break;
      const differs = dr.ex.length && JSON.stringify(dr.ex) !== JSON.stringify(tpl.ex);
      if (differs && !window.confirm('Nahradiť aktuálny zoznam cvikov pôvodnou šablónou?')) break;
      dr.ex = clone(tpl.ex); renderExList();
      break;
    }
    case 'pick-target': pickTarget(el.dataset.date); break;
    case 'do-swap': doSwap(false); break;
    case 'do-copy': doSwap(true); break;
    case 'sync-settings': openSyncSettings(); break;
    case 'sync-now': syncNow(); break;
    case 'sync-save-token': saveToken(); break;
    case 'sync-clear-token': clearToken(); break;
  }
});

document.addEventListener('change', e => {
  if (e.target.matches('input[data-action="done"]')) toggleDone(e.target);
});

document.addEventListener('input', e => {
  if (!modal || modal.kind !== 'edit') return;
  const t = e.target;
  if (t.dataset.ex) { const row = modal.draft.ex[+t.dataset.i]; if (row) row[t.dataset.ex] = t.value; }
  else if (t.name && Object.prototype.hasOwnProperty.call(modal.draft, t.name)) {
    modal.draft[t.name] = t.value;
    if (t.name === 'title') modal.titleTouched = true;
  }
});

document.addEventListener('submit', e => {
  if (e.target.id === 'edit-form') { e.preventDefault(); saveEdit(); }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal) closeModal(); });

app.addEventListener('toggle', e => {
  const t = e.target;
  if (t.matches && t.matches('details.ex-details')) { if (t.open) openEx.add(t.dataset.date); else openEx.delete(t.dataset.date); }
}, true);

window.addEventListener('storage', e => {
  if (e.key !== STORAGE_KEY || !e.newValue) return;
  try { state = normalize(JSON.parse(e.newValue)); if (!modal) render(); } catch (err) { /* ignoruj */ }
});

let lastToday = todayIso();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (lastToday !== todayIso()) { lastToday = todayIso(); if (!modal) render(); }
  pullIfStale(10000);
});
window.addEventListener('focus', () => pullIfStale(10000));
window.addEventListener('online', () => syncNow());
setInterval(() => { if (!document.hidden && ghToken()) pullIfStale(60000); }, 90000);

/* =====================================================================
   ŠTART
   ===================================================================== */
const t0 = todayIso();
view.week = t0 < START ? 0 : t0 > END ? 6 : weekOf(t0);
render();
if (conflict && !GH.owner) {
  toast('V tomto prehliadači máš novšie zmeny než v tomto súbore – zobrazujem tie novšie.', {
    label: 'Použiť verziu zo súboru',
    fn: () => { snapshot(); replaceState(normalize(bakedState)); render(); }
  }, 15000);
}
syncNow();
})();
</script>
